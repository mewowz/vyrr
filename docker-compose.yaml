services:
  vyrr:
    build: .
    configs:
      - source: vyrr-config
        target: /app/config.yml
    volumes:
      - vyrr-data:/app/data
    ports:
      - 9743:9743
    restart: unless-stopped
    stop_grace_period: 70s

configs:
  vyrr-config:
    file: ./config.yml

volumes:
  vyrr-data:
